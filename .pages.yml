media:
  input: assets/uploads
  output: /assets/uploads

settings:
  content:
    merge: true

components:
  document_fields:
    type: object
    label: Document fields
    fields: &docfields
      - { name: layout, type: string, hidden: true }
      - { name: permalink, type: string, hidden: true }
      - { name: cms_key, type: string, hidden: true }
      - { name: handle, type: string, label: Menu label }
      - { name: nav_order, type: number, label: "Menu position (10, 20, 30...)" }
      - { name: title, type: string, label: Title }
      - { name: eyebrow, type: string, label: Eyebrow }
      - { name: intro, type: text, label: Introduction }
      - { name: body, type: rich-text, label: Page content }

content:
  - name: main_pages
    label: "Main pages"
    type: group
    items:
      - { name: profile, label: "10 · Profile", type: file, path: profile.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: education, label: "20 · LM058", type: file, path: education.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: skills_profile, label: "30 · Co-op", type: file, path: skills-profile.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: blog, label: "40 · Blog", type: file, path: blog.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: projects, label: "50 · Projects", type: file, path: projects.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: academic_record, label: "Academic Record", type: file, path: academic-record.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: pivotal_corporate, label: "Co-op — Pivotal Corporate", type: file, path: pivotal-corporate.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: csp, label: "Co-op — Corporate Services (CSP)", type: file, path: csp.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: hse_finance, label: "Co-op — Medical Finance", type: file, path: hse-finance.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: general_interview, label: "Co-op — General Interview Questions", type: file, path: interview.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: preparation, label: "Co-op — Skills & Evidence", type: file, path: preparation.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: sectors, label: "Sectors", type: file, path: sectors.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: workplace_skills, label: "Workplace Skills", type: file, path: workplace-skills.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: glossary, label: "Glossary", type: file, path: glossary.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: cycling, label: "Cycling", type: file, path: cycling.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: cooking, label: "Cooking", type: file, path: cooking.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }

  - name: preparation_pages
    label: "Co-op preparation"
    type: collection
    path: preparation
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: module_pages
    label: "Modules"
    type: collection
    path: modules
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: education_pages
    label: "Education notes"
    type: collection
    path: education
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: project_pages
    label: "Project notes"
    type: collection
    path: projects
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: sector_pages
    label: "Sectors"
    type: collection
    path: sectors
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: aviation_pages
    label: "Aviation"
    type: collection
    path: aviation
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields
