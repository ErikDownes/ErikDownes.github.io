media:
  input: assets/uploads
  output: /assets/uploads

settings:
  content:
    merge: true

components:
  document_fields:
    type: object
    label: Document fields
    fields: &docfields
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, label: Title }
      - { name: eyebrow, type: string, label: Eyebrow }
      - name: body
        type: rich-text
        label: Page content
        options:
          format: markdown
          switcher: true

content:
  - name: main_pages
    label: "Main pages"
    type: group
    items:
      - { name: profile, label: "Profile", type: file, path: profile.md, format: code, operations: { delete: false } }
      - { name: skills_profile, label: "ULCV — Tailored for CMS", type: file, path: skills-profile.md, format: code, operations: { delete: false } }
      - { name: academic_record, label: "Academic Record", type: file, path: academic-record.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: education, label: "BSc Financial Mathematics", type: file, path: education.md, format: code, operations: { delete: false } }
      - { name: projects, label: "Projects", type: file, path: projects.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: pivotal_corporate, label: "Pivotal Corporate", type: file, path: pivotal-corporate.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: csp, label: "Corporate Services", type: file, path: csp.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: preparation, label: "Preparation", type: file, path: preparation.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: sectors, label: "Sectors", type: file, path: sectors.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: workplace_skills, label: "Workplace Skills", type: file, path: workplace-skills.md, format: code, operations: { delete: false } }
      - { name: blog, label: "Blog", type: file, path: blog.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: glossary, label: "Glossary", type: file, path: glossary.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: cycling, label: "Cycling", type: file, path: cycling.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: cooking, label: "Cooking", type: file, path: cooking.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }

  - name: preparation_pages
    label: "Preparation"
    type: collection
    path: preparation
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: module_pages
    label: "Modules"
    type: collection
    path: modules
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: education_pages
    label: "Education notes"
    type: collection
    path: education
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: project_pages
    label: "Project notes"
    type: collection
    path: projects
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: sector_pages
    label: "Sectors"
    type: collection
    path: sectors
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: aviation_pages
    label: "Aviation"
    type: collection
    path: aviation
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields
