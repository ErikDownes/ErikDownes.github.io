media:
  input: assets/uploads
  output: /assets/uploads

settings:
  content:
    merge: true

components:
  document_fields:
    type: object
    label: Document fields
    fields: &docfields
      - { name: layout, type: string, hidden: true }
      - { name: permalink, type: string, hidden: true }
      - { name: cms_key, type: string, hidden: true }
      - { name: handle, type: string, label: Menu label }
      - { name: nav_order, type: number, label: "Menu position (10, 20, 30...)" }
      - { name: top_nav, type: boolean, hidden: true }
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: eyebrow, type: string, label: Eyebrow }
      - { name: intro, type: text, label: Introduction }
      - { name: body, type: rich-text, label: Page content }

content:
  - name: main_pages
    label: "Main pages"
    type: group
    items:
      - { name: profile, label: "10 · About Me", type: file, path: profile.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: pivotal_corporate_study, label: "15 · CV", type: file, path: pivotal-corporate-study.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: cv_qa, label: "16 · CV QA", type: file, path: cv-qa.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: technology, label: "20 · Technology", type: file, path: technology.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: people, label: "30 · Teamwork", type: file, path: people.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: motivation, label: "40 · Motivation", type: file, path: motivation.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: initiative, label: "50 · Initiative", type: file, path: initiative.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: finance_role, label: "60 · Finance", type: file, path: finance-role.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: communication, label: "70 · Communication", type: file, path: communication.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: qa, label: "80 · Career", type: file, path: qa.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: analytics, label: "90 · Analytics", type: file, path: analytics.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: education, label: "20 · Financial Maths", type: file, path: education.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: academic_record, label: "30 · Results", type: file, path: academic-record.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: job_spec, label: "39 · Job Spec", type: file, path: job-spec.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: pivotal_corporate, label: "50 · Pivotal Corporate Interview", type: file, path: pivotal-corporate.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: hse_job_spec, label: "55 · HSE Job Specification", type: file, path: hse.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: hse_finance_study, label: "60 · HSE Finance Study", type: file, path: hse-finance-study.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: hse_finance_interview, label: "70 · HSE Finance Interview", type: file, path: hse-finance-interview.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: projects, label: "90 · Projects", type: file, path: projects.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: blog, label: "100 · Blog", type: file, path: blog.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - name: contact
        label: "Contact"
        type: file
        path: contact.md
        format: yaml-frontmatter
        fields:
          - { name: layout, type: string, hidden: true }
          - { name: permalink, type: string, hidden: true }
          - { name: handle, type: string, label: Menu label }
          - { name: nav_order, type: number, label: "Menu position (10, 20, 30...)" }
          - { name: title, type: string, label: Browser/page title }
          - { name: description, type: text, label: Description }
          - { name: contact_heading, type: string, label: Main heading }
          - { name: contact_intro, type: text, label: Intro line }
          - { name: linkedin_heading, type: string, label: LinkedIn heading }
          - { name: linkedin_intro, type: text, label: LinkedIn text }
        operations: { delete: false }
      - { name: csp, label: "Co-op — Corporate Services (CSP)", type: file, path: csp.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: general_interview, label: "Co-op — General Interview Questions", type: file, path: interview.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: preparation, label: "Co-op — Skills & Evidence", type: file, path: preparation.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: sectors, label: "Sectors", type: file, path: sectors.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: workplace_skills, label: "Workplace Skills", type: file, path: workplace-skills.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: glossary, label: "Acronyms and Glossary", type: file, path: glossary.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: cycling, label: "Cycling", type: file, path: cycling.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
      - { name: cooking, label: "Cooking", type: file, path: cooking.md, format: yaml-frontmatter, fields: *docfields, operations: { delete: false } }
  - name: preparation_pages
    label: "Co-op preparation"
    type: collection
    path: preparation
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: module_pages
    label: "Modules"
    type: collection
    path: modules
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: education_pages
    label: "Education notes"
    type: collection
    path: education
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: project_pages
    label: "Project notes"
    type: collection
    path: projects
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: sector_pages
    label: "Sectors"
    type: collection
    path: sectors
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields

  - name: aviation_pages
    label: "Aviation"
    type: collection
    path: aviation
    format: yaml-frontmatter
    subfolders: true
    fields: *docfields
