media:
  - name: images
    label: Images
    input: assets/uploads
    output: /assets/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

components:
  document_fields:
    type: object
    label: Document fields
    fields: &docfields
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Menu handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: nav_order, type: number, label: "Menu order" }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - { name: intro, type: text, label: Introduction, required: false }
      - name: image
        type: image
        label: "Page image"
        description: "Optional image shown below the introduction."
        options:
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
      - { name: image_alt, type: string, label: "Image description" }
      - name: body
        type: rich-text
        label: "Answers (handle | question)"
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

  career_fields:
    type: object
    label: Career page fields
    fields: &careerfields
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Page handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - { name: intro, type: text, label: Introduction, required: false }
      - name: body
        type: rich-text
        label: "Questions and answers (handle | question)"
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

content:
  - { name: about_me, label: "About Me", type: file, path: profile.md, format: yaml-frontmatter, fields: *docfields }
  - { name: aviation, label: "Aviation", type: file, path: aviation.md, format: yaml-frontmatter, fields: *docfields }
  - { name: coursework, label: "Coursework", type: file, path: coursework.md, format: yaml-frontmatter, fields: *docfields }
  - { name: career, label: "Career", type: file, path: career.md, format: code }
  - { name: career_preparation, label: "Career · Preparation", type: file, path: career/preparation.md, format: yaml-frontmatter, fields: *careerfields }

  - { name: career_working_with_others, label: "Career · Working with Others", type: file, path: career/working-with-others.md, format: yaml-frontmatter, fields: *careerfields }
  - { name: career_working_independently, label: "Career · Working Independently", type: file, path: career/working-independently.md, format: yaml-frontmatter, fields: *careerfields }
  - { name: career_communication, label: "Career · Communication", type: file, path: career/communication.md, format: yaml-frontmatter, fields: *careerfields }
  - { name: career_problem_solving_judgement, label: "Career · Problem Solving & Judgement", type: file, path: career/problem-solving-judgement.md, format: yaml-frontmatter, fields: *careerfields }
  - { name: career_technology_ai, label: "Career · Technology & AI", type: file, path: career/technology-ai.md, format: yaml-frontmatter, fields: *careerfields }

  - name: modules
    label: "Coursework Modules"
    type: collection
    path: modules
    format: yaml-frontmatter
    subfolders: false
    filename: "{code}-{title}.md"
    fields:
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, label: "Page title" }
      - { name: code, type: string, label: "Module code" }
      - { name: year, type: string, label: "Year" }
      - { name: semester, type: string, label: "Semester" }
      - { name: status, type: string, label: "Status", required: false }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - { name: intro, type: text, label: Introduction }
      - name: body
        type: rich-text
        label: "Module notes"
        description: "Paste lecturer material here, then reduce it to upper-level concepts, explanations, applications and interview questions."
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
    operations:
      rename: false
    view:
      primary: title
      fields: [code, year, semester, status]
      sort: [title, code, year, semester]
      search: [title, code, year, semester, status]
      default:
        sort: title
        order: asc
  - { name: portfolio, label: "Portfolio", type: file, path: portfolio.md, format: yaml-frontmatter, fields: *docfields }
  - { name: glossary, label: "Glossary (A–Z)", type: file, path: glossary.md, format: yaml-frontmatter, fields: *docfields }
