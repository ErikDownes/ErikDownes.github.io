<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Excel · Interactive school</title>

.progress{font-size:.8rem;color:var(--mute);padding:15px 10px 0;border-top:1px solid var(--border);margin-top:13px}
.content{min-width:0}.intro{padding:5px 5px 17px}.intro h1{font-size:clamp(1.45rem,2.2vw,2.05rem);margin:0 0 5px;line-height:1.2}.intro p{margin:0;color:var(--mute)}

.stages{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:0 0 13px;margin:0 0 18px}
.stages button{border:1px solid #d1dfec;border-radius:9px;background:#fff;padding:9px 13px;font-size:.89rem;font-weight:750}
.stages button[aria-selected=true]{background:#1558b7;border-color:#1558b7;color:#fff}
.task{font-size:1rem;margin-bottom:15px}.task strong{display:block;margin:0 0 5px;font-size:1.08rem}.task p{margin:0 0 8px;color:#40576c}

.namebox{text-align:center;padding:9px 4px;background:white;border:1px solid #d1dce8;border-radius:7px;font-weight:800;font-family:Consolas,monospace;font-size:.92rem}
.fx{text-align:center;font-style:italic;color:#54718f;font-weight:800}
.formula-bar input{width:100%;padding:9px 11px;min-height:43px;border:1px solid #c6d4e2;background:white;border-radius:7px;font:600 .93rem Consolas,monospace;color:#173752}
.formula-bar input:focus{outline:2px solid #71a5f2}

.table-title{font-size:.87rem;font-weight:800;color:#465a6e;margin:0 0 8px}
.grid-scroll{overflow:auto;border:1px solid var(--border);border-radius:9px}

.excel td,.excel th{border:1px solid #e0e6ed;text-align:center;height:55px;padding:7px 5px;vertical-align:middle;overflow-wrap:anywhere}
.excel thead th{height:29px;background:#edf2f7;color:#65738a;font-size:.74rem;font-weight:700}
.excel thead tr:last-child th{background:#f5f7fa;color:#26384a;font-size:.81rem;height:45px}
.excel .index{width:33px;min-width:33px;background:#eef3f8;color:#65738a;font-size:.76rem;font-weight:700}
.excel td{font-size:.92rem;background:white;cursor:pointer}
.excel td.source{background:#fffbeb}.excel td.computed{background:#ebf4ff;color:#134f9d;font-weight:750}
.excel td.blank-result{background:#fff8e5}.excel td.selected{outline:3px solid #2773d6;outline-offset:-3px}

function isSource(ref){var m=model().m;return ref.slice(1)!=='1'&&!outputRef(ref)&&!(state.topic==='pivot'&&ref[0]==='E')&&Object.prototype.hasOwnProperty.call(m,ref)}
function readFormula(ref){var stage=state.stage,t=state.topic,c=ref[0],r=Number(ref.slice(1)),f=settings[t].fx||{};if(!outputRef(ref)||!f[c])return '';if(stage===0)return shift(f[c],r-2);if(stage===1&&r===2)return f[c];if(stage===1)return state.formulas[key()+'-'+ref]||'';if(stage>=2){var own=state.formulas[t+'-2-'+c+'2']||'';return own?shift(own,r-2):''}return ''}
function selected(){var s=state.selected[key()]||settings[state.topic].output[0]+'2';return s}
function pretty(v,ref){if(v===''||v===undefined||v===null)return '—';if(typeof v==='number'){if((settings[state.topic].money||[]).indexOf(ref[0])>=0)return '€'+v.toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});return Number(v.toFixed(2)).toLocaleString('en-IE')}return String(v)}
function oneTable(tab,m){var h='<div class="grid-scroll"><table class="excel"><thead><tr><th class="index"></th>';tab.cols.forEach(function(c){h+='<th>'+c+'</th>'});h+='</tr><tr><th class="index">1</th>';tab.cols.forEach(function(c){h+='<th>'+html(m[c+'1'])+'</th>'});h+='</tr></thead><tbody>';
for(var r=2;r<=tab.count+1;r++){h+='<tr><th class="index">'+r+'</th>';tab.cols.forEach(function(c){var ref=c+r,computed=outputRef(ref),v=computed?output(ref,m):m[ref],cl=computed?'computed':'source';if(computed&&v==='')cl='blank-result';var err=typeof v==='string'&&v[0]==='#';h+='<td data-ref="'+ref+'" tabindex="0" aria-label="Cell '+ref+'" class="'+cl+(err?' err':'')+(selected()===ref?' selected':'')+'">';if(!computed&&isSource(ref)){h+='<input data-input="'+ref+'" aria-label="Edit '+ref+'" value="'+html(v)+'">'}else h+=html(pretty(v,ref));h+='</td>'});h+='</tr>'}return h+'</tbody></table></div>'}
function formBar(){var m=model().m,ref=selected(),v=outputRef(ref)?readFormula(ref):m[ref],readonly=outputRef(ref)&&(state.stage===0||state.stage===3||state.topic==='pivot');var allow=outputRef(ref)?!readonly:isSource(ref);
if(state.topic==='pivot'&&outputRef(ref))v='Pivot summary: SUM of Distance km grouped by '+(state.pivot[key()]||'Month');
return '<div class="formula-bar"><span id="namebox" class="namebox">'+html(ref)+'</span><span class="fx">fx</span><input id="formula-field" aria-label="Formula bar showing selected cell contents" value="'+html(v==null?'':v)+'" '+(allow?'':'readonly')+'></div><div class="formula-help" id="bar-help">'+html(outputRef(ref)?(state.topic==='pivot'?'Pivot summary — calculated by grouping, not an ordinary cell formula':readonly?'Calculated formula · select any result to inspect it':'Type a formula here and press Enter'):isSource(ref)?'Entered value · edit this cell or change it in the grid':'Choose any cell to inspect its contents')+'</div>'}
function docs(stage){var s=settings[state.topic];if(stage===0)return ['Explore a finished model','Every blue cell works. Click any cell to inspect the entered value or formula above the grid. Change a yellow input and predict the result before checking it.'];if(stage===1)return ['Finish this model','A different dataset. Row 2 is worked out. Click the blank result in row 3 and write your own formula. Complete row 4 as well; try extra rows if you want.'];if(stage===2)return ['Build and test from scratch','A third dataset, with no worked result. Select the first blank result in row 2 and write a formula from memory. Apply it, then change an input to test whether it still works.'];return ['Assessment as learning · Reflect','You are judging your own understanding, not giving a formal definition. Predict, check, explain what changed and identify what you would improve.']}
function renderWorkspace(){var stage=state.stage,t=state.topic,s=settings[t],d=data(),m=model(),text=docs(stage);var h='<div class="task"><strong>'+html(text[0])+'</strong><p>'+html(text[1])+'</p><p class="note"><b>Goal:</b> '+html(s.aim)+'</p></div>';
if(t==='basics'&&stage===1)h+='<div class="hint">Sequence warm-up: Jan, Feb, Mar… through Dec. In Excel, enter Jan and Feb, select both cells and drag the fill handle to extend the pattern. Here, recognise the sequence and then complete the distance formulas.</div>';
h+=formBar();
if(t==='pivot')h+='<div class="pivot-tools"><label for="group">Group rides by</label><select id="group"><option'+((state.pivot[key()]||'Month')==='Month'?' selected':'')+'>Month</option><option'+((state.pivot[key()]||'Month')==='Region'?' selected':'')+'>Region</option></select><span class="note">Real Excel: Insert → PivotTable → Rows = chosen group, Values = Sum of Distance.</span></div>';
h+='<div class="tables'+(m.tables.length>1?' split':'')+'">';
m.tables.forEach(function(tab){h+='<div><p class="table-title">'+html(tab.title)+'</p>'+oneTable(tab,m.m)+'</div>'});h+='</div>';
if(stage===0)h+='<div class="actions"><button class="button" data-action="reset">Restore original example</button><button class="button primary" data-action="next">Now finish one yourself →</button></div><div class="hint">Try changing a number, a product code or a region. Watch which results update. Then inspect a blue result in the formula bar.</div>';
if(stage===1)h+='<div class="actions"><button class="button" data-action="hint">Show a small hint</button><button class="button primary" data-action="check-guided">Check rows 3 and 4</button><button class="button" data-action="next">Build without the example →</button></div>';
if(stage===2)h+='<div class="actions"><button class="button" data-action="hint">Hint if needed</button><button class="button primary" data-action="test">Run tests</button><button class="button" data-action="next">Reflect on my learning →</button></div><div class="hint">Test at least one changed input. The check tests your formula against several rows and a change to the data, not just the first displayed answer.</div>';
if(stage===3){var checks=state.checked[t]||{},memo=state.notes[t]||'';h+='<div class="reflect"><div class="reflect-checks"><p><strong>My own checks</strong></p>';
['I predicted the result before changing an input.','I checked a result against the source data.','I can explain what the formula does for a colleague.'].forEach(function(q,i){h+='<label><input type="checkbox" data-check="'+i+'" '+(checks[i]?'checked':'')+'> '+html(q)+'</label>'});h+='</div><div><label for="my-note"><strong>What did I notice?</strong></label><p class="note">Sentence starter: “I changed …, so … changed. This matters because …”</p><textarea id="my-note" placeholder="Two short sentences, in my own words">'+html(memo)+'</textarea></div></div>';
h+='<div class="actions"><button class="button" data-action="model">Show an example explanation</button><button class="button primary" data-action="reflect">Save my reflection</button></div><div id="model" class="hint" hidden>'+html(s.explain)+'</div>';}
h+='<div id="feedback" role="status" class="message"></div><div id="hintbox" class="hint" hidden>'+html(t==='lookup'?'Use the order code from E2 and the catalogue A2:C6. In VLOOKUP, use column 3 and FALSE.':t==='sumifs'?'SUMIFS needs the distance range C2:C7, region range A2:A7 and a summary-region cell such as E2.':t==='pivot'?'Select a group such as Region and compare the totals with the original rides.':t==='clean'?'TRIM removes extra spaces. PROPER uses normal name case. LOWER changes letters to lowercase.':'Ask what two inputs you are comparing or combining, then select them from the same row.')+'</div>';
document.getElementById('workspace').innerHTML=h;bind();resize()}
function show(ref){state.selected[key()]=ref;save();var m=model().m,field=document.getElementById('formula-field'),v=outputRef(ref)?readFormula(ref):m[ref];
if(state.topic==='pivot'&&outputRef(ref))v='Pivot summary: SUM of Distance km grouped by '+(state.pivot[key()]||'Month');
field.value=v==null?'':v;field.readOnly=outputRef(ref)?(state.stage===0||state.stage===3||state.topic==='pivot'):!isSource(ref);
document.getElementById('namebox').textContent=ref;document.getElementById('bar-help').textContent=outputRef(ref)?(state.topic==='pivot'?'Pivot result · grouped calculation':field.readOnly?'Formula behind the result':'Enter a formula here, then press Enter'):isSource(ref)?'Entered value, not a formula':'Header';
document.querySelectorAll('[data-ref]').forEach(function(c){c.classList.toggle('selected',c.dataset.ref===ref)})}
function writeValue(ref,newValue){var old=model().m[ref],v=typeof old==='number'?Number(newValue):newValue;var d=data(),r=Number(ref.slice(1))-2,c=ncol(ref[0]);if(state.topic==='lookup'){if(c<=2)d.catalog[r][c]=v;else if(c>=4&&c<=5)d.orders[r][c-4]=v}
else if(state.topic==='sumifs'){if(c<=2)d.data[r][c]=v;else if(c===4)d.keys[r]=v}
else if(state.topic==='pivot'){if(c<=2)d[r][c]=v}
else d[r][c]=v;save();renderWorkspace();show(ref)}
function writeFormula(ref,f){if(!outputRef(ref)||state.stage===0||state.stage===3||state.topic==='pivot')return;state.formulas[key()+'-'+ref]=f.trim();save();renderWorkspace();show(ref)}
function match(a,b){if(typeof a==='number'&&typeof b==='number')return Math.abs(a-b)<.001;return a===b}
function verifyGuided(){var m=model().m,targets=state.topic==='clean'?['D3','E3','D4','E4']:[settings[state.topic].output[0]+'3',settings[state.topic].output[0]+'4'];
if(state.topic==='pivot'){document.getElementById('feedback').textContent='Check that each group includes only its own records and that the totals add up to the source data.';return}
var wrong=targets.filter(function(ref){return !state.formulas[key()+'-'+ref]||!match(output(ref,m),calc(shift(settings[state.topic].fx[ref[0]],Number(ref.slice(1))-2),m))});message(wrong.length?'Try these cells again: '+wrong.join(', ')+'. Check each reference against its row.':'Well done. The guided rows match. Try changing a source value before moving on.',!wrong.length)}
function verifyBuild(){if(state.topic==='pivot'){message('Check your grouping against the original rides. A pivot should account for every ride exactly once.',true);return}
var m=model().m,outs=settings[state.topic].output,wrong=[],d=data();for(var i=0;i<outs.length;i++){var c=outs[i],f=state.formulas[key()+'-'+c+'2'];if(!f){wrong.push(c+'2');continue}for(var r=2;r<=Math.min(5,settings[state.topic].label==='VLOOKUP'?6:state.topic==='sumifs'?4:d.length+1);r++){var g=calc(shift(f,r-2),m),w=calc(shift(settings[state.topic].fx[c],r-2),m);if(!match(g,w)){wrong.push(c+r);break}}}
if(!wrong.length){var altered=Object.assign({},m);if(state.topic==='lookup'){altered.C2=Number(m.C2)+17;altered.E2=m.A2}
else if(state.topic==='clean')altered.A2='  NEW NAME ',altered.C2='EXAMPLE@MAIL.COM';
else if(state.topic==='sumifs')altered.C2=Number(m.C2)+51;
else if(state.topic==='if'||state.topic==='ifs')altered.C2=Number(m.B2)+17;
else altered.B2=Number(m.B2)+2;
for(var j=0;j<outs.length;j++){var cc=outs[j],user=calc(state.formulas[key()+'-'+cc+'2'],altered),goal=calc(settings[state.topic].fx[cc],altered);if(!match(user,goal))wrong.push(cc+'2 test case')}}
message(wrong.length?'Not quite: '+wrong.join(', ')+'. Check the cell references and test after changing an input.':'Your formulas match the sample rows and a changed-data test. Now explain why those results matter.',!wrong.length);if(!wrong.length){state.tests[state.topic]=true;save()}}
function message(v,good){var el=document.getElementById('feedback');el.textContent=v;el.className='message '+(good?'good':'bad')}
function bind(){
document.querySelectorAll('[data-ref]').forEach(function(td){td.addEventListener('click',function(){show(td.dataset.ref)});td.addEventListener('keydown',function(e){if(e.key==='Enter'){show(td.dataset.ref);document.getElementById('formula-field').focus()}})});
document.querySelectorAll('[data-input]').forEach(function(inp){inp.addEventListener('focus',function(){show(inp.dataset.input)});inp.addEventListener('change',function(){writeValue(inp.dataset.input,inp.value)})});
document.getElementById('formula-field').addEventListener('keydown',function(e){if(e.key==='Enter'){var ref=selected(),v=e.target.value;if(outputRef(ref))writeFormula(ref,v);else if(isSource(ref))writeValue(ref,v)}});
document.querySelectorAll('[data-action]').forEach(function(b){b.addEventListener('click',function(){var action=b.dataset.action;if(action==='reset'){delete state.sets[key()];save();renderWorkspace()}
if(action==='next'){state.stage=Math.min(3,state.stage+1);save();render()}
if(action==='hint'){document.getElementById('hintbox').hidden=false;resize()}
if(action==='check-guided')verifyGuided();if(action==='test')verifyBuild();if(action==='model'){document.getElementById('model').hidden=false;resize()}
if(action==='reflect'){var c=state.checked[state.topic]||{},count=Object.keys(c).filter(function(k){return c[k]}).length;message(count===3?'Self-assessment saved. You can return to any stage, try new values or ask AI for a fresh dataset.':'Choose the checks you have genuinely completed. Go back and test anything you are unsure about.',count===3);save()}})});
document.querySelectorAll('[data-check]').forEach(function(el){el.addEventListener('change',function(){var c=state.checked[state.topic]||{};c[el.dataset.check]=el.checked;state.checked[state.topic]=c;save()})});
var note=document.getElementById('my-note');if(note)note.addEventListener('input',function(){state.notes[state.topic]=note.value;save()});
var sel=document.getElementById('group');if(sel)sel.addEventListener('change',function(){state.pivot[key()]=sel.value;state.selected[key()]='F2';save();renderWorkspace()})}
function render(){document.getElementById('lesson-title').textContent=settings[state.topic].title;document.getElementById('lesson-sub').textContent=settings[state.topic].intro;
var nav=document.getElementById('topics');nav.innerHTML='';order.forEach(function(id,i){var b=document.createElement('button');b.innerHTML='<span class="ordinal">'+(i+1)+'</span><span>'+html(settings[id].label)+'</span>';if(id===state.topic)b.setAttribute('aria-current','page');b.addEventListener('click',function(){state.topic=id;state.stage=0;save();render()});nav.appendChild(b)});
var stages=document.getElementById('stages');stages.innerHTML='';['Explore','Finish','Build & test','Reflect'].forEach(function(name,i){var b=document.createElement('button');b.textContent=(i+1)+' · '+name;b.setAttribute('aria-selected',String(state.stage===i));b.addEventListener('click',function(){state.stage=i;save();render()});stages.appendChild(b)});
document.getElementById('progress').textContent=order.filter(function(id){return state.tests[id]}).length+' of 8 build tests passed · no login';renderWorkspace()}
function resize(){try{window.parent.postMessage({type:'master-excel-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}
if('ResizeObserver' in window)new ResizeObserver(resize).observe(document.body);window.addEventListener('load',resize);render();
})();
</script></body></html>
