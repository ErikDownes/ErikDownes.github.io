<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Answers & Questions — Prototype</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182b3c;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:30px 18px 80px}header{margin-bottom:24px}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.4rem)}p{line-height:1.6}.sub{color:#536777;margin:0}.notice{background:#fff8e5;padding:9px 13px;border-radius:8px;font-size:.85rem;margin:15px 0;color:#675015}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.mode{border:1px solid #abc0d2;border-radius:10px;padding:4px;background:white;display:flex;gap:4px}.mode button{border:0;background:transparent;padding:10px 13px;border-radius:7px;cursor:pointer;color:#214965;font:inherit}.mode button[aria-pressed=true]{background:#185782;color:white}select,input{border:1px solid #c6d2dc;border-radius:8px;padding:10px;font:inherit;background:white}input{flex:1;min-width:170px}.stats{color:#4d6172;font-size:.9rem;margin:12px 0}.domain{margin:28px 0 10px;font-size:1.15rem;border-bottom:2px solid #d1e0e9;padding-bottom:7px}.card{background:white;border:1px solid #dee7ec;border-radius:12px;margin:12px 0;overflow:hidden;box-shadow:0 2px 9px #132b4010}.card summary{cursor:pointer;padding:16px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}.card summary::-webkit-details-marker{display:none}.card summary:after{content:"＋";color:#315a76}.card[open] summary:after{content:"−"}.content{border-top:1px solid #e5ebef;padding:16px 18px}.answer{margin:0 0 16px;white-space:pre-wrap}.cues{display:flex;justify-content:space-evenly;gap:12px;flex-wrap:wrap;background:#f4f9fd;padding:13px 10px;color:#0057d9;font-weight:400;font-size:.91rem;border-radius:8px}.q-toggle{margin-top:15px;background:#fff;border:1px solid #bcd0df;border-radius:7px;padding:9px 12px;color:#15527c;font:inherit;cursor:pointer}.questions{margin:11px 0 0;padding-left:22px;line-height:1.6}.pill{font-size:.78rem;color:#637888;font-weight:400}.empty{padding:20px;background:white;border-radius:8px}@media(max-width:600px){.wrap{padding:20px 12px}.tools{align-items:stretch}.mode{width:100%}.mode button{flex:1}.cues{justify-content:space-around}}
</style></head><body><main class="wrap"><header><h1>Answers & Questions</h1><p class="sub">Permanent answer IDs. Multiple domains. Two ways to practise.</p><p class="notice">Test prototype on a separate GitHub branch. Live interview pages are unchanged.</p></header>
<div class="tools"><div class="mode" role="group" aria-label="Practice direction"><button id="answersBtn" aria-pressed="true">Answers first</button><button id="questionsBtn" aria-pressed="false">Questions first</button></div><select id="domain"><option value="">All domains</option><option>Opening</option><option>Direction</option><option>Capabilities</option><option>Experience</option><option>Closing</option></select><input id="search" type="search" placeholder="Search answers or questions" aria-label="Search answers or questions"></div><div class="stats" id="stats"></div><div id="results"></div></main>
<script>
(async()=>{
 const container=document.getElementById('results'),stats=document.getElementById('stats'),search=document.getElementById('search'),domain=document.getElementById('domain'),ab=document.getElementById('answersBtn'),qb=document.getElementById('questionsBtn');
 let mode='answers',bank=[];
 try {const response=await fetch('./assets/data/interview-answers.json'); if(!response.ok)throw Error('Failed to load master answer bank');bank=(await response.json()).answers;}catch(e){container.textContent='Unable to load answers: '+e.message;return;}
 const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;};
 function render(){
  ab.setAttribute('aria-pressed',String(mode==='answers'));qb.setAttribute('aria-pressed',String(mode==='questions'));
  const query=search.value.trim().toLowerCase();
  const filtered=bank.filter(a=>(!domain.value||a.domains.includes(domain.value))&&(!query||[a.title,a.answer,a.domain,...a.questions,...a.breadcrumbs].join(' ').toLowerCase().includes(query)));
  const records=mode==='answers'?filtered.map(a=>({key:a.id,title:a.title,domains:a.domains,answers:[a],question:null})):Array.from(filtered.flatMap(a=>a.questions.map(q=>({q,a})))).reduce((out,{q,a})=>{const existing=out.find(x=>x.key===q.toLowerCase().trim());if(existing){existing.answers.push(a);existing.domains=[...new Set([...existing.domains,...a.domains])];}else out.push({key:q.toLowerCase().trim(),title:q,domains:[...a.domains],answers:[a],question:q});return out},[]);
  stats.textContent=filtered.length+' core answers · '+filtered.reduce((n,a)=>n+a.questions.length,0)+' linked questions';
  container.replaceChildren();if(!records.length){container.appendChild(el('p','empty','No matches.'));return;}
  for(const section of ['Opening','Direction','Capabilities','Experience','Closing']){
   const group=records.filter(r=>r.domains[0]===section);if(!group.length)continue;container.appendChild(el('h2','domain',section));
   group.forEach(r=>{
    const card=el('details','card'),title=el('summary','',r.title),counter=el('span','pill',mode==='answers'?r.answers[0].questions.length+' question(s)':r.answers.length+' answer(s)');title.appendChild(counter);card.appendChild(title);
    const body=el('div','content');for(const a of r.answers){if(mode==='questions')body.appendChild(el('strong','',a.title));body.appendChild(el('p','answer',a.answer));if(a.breadcrumbs.length){const cues=el('div','cues');a.breadcrumbs.forEach(c=>cues.appendChild(el('span','',c)));body.appendChild(cues);}
    if(mode==='answers'){const toggle=el('button','q-toggle','Reveal possible questions');toggle.type='button';toggle.setAttribute('aria-expanded','false');const list=el('ul','questions');list.hidden=true;a.questions.forEach(q=>list.appendChild(el('li','',q)));toggle.addEventListener('click',()=>{list.hidden=!list.hidden;toggle.setAttribute('aria-expanded',String(!list.hidden));toggle.textContent=list.hidden?'Reveal possible questions':'Hide questions';});body.append(toggle,list);}
    }card.appendChild(body);container.appendChild(card);
   });
  }
 }
 ab.addEventListener('click',()=>{mode='answers';render()});qb.addEventListener('click',()=>{mode='questions';render()});domain.addEventListener('change',render);search.addEventListener('input',render);render();
})();
</script></body></html>
