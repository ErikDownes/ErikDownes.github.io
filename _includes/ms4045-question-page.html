<style>
.doc-paper{width:min(980px,calc(100vw - 24px));padding:28px clamp(14px,3vw,34px) 42px}
.doc-paper>.doc-kicker,.doc-toolbar{display:none!important}
.doc-paper>h1{margin:0 0 18px;font-size:clamp(1.55rem,4vw,2.35rem);line-height:1.15;color:#132f49}
.ms4045-q-shell{max-width:900px;margin:0 auto}
.ms4045-q-topnav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 18px;font-size:.93rem}
.ms4045-q-topnav a,.ms4045-return{
  display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid #cdd9e2;border-radius:999px;
  background:#fff;color:#184f73;text-decoration:none!important;font-weight:850
}
.ms4045-problem-paper{
  position:relative;margin:0 0 24px;padding:clamp(24px,5vw,44px);border:1px solid #d8dde2;border-radius:18px;background:#fff;
  box-shadow:0 7px 22px rgba(15,23,42,.07);font-family:Georgia,"Times New Roman",serif;color:#111
}
.ms4045-problem-paper h2,.ms4045-problem-paper h3{font-family:Georgia,"Times New Roman",serif;color:#111}
.ms4045-problem-paper h2{margin:0 0 22px;font-size:clamp(1.35rem,4vw,2rem)}
.ms4045-problem-paper h3{margin:0 0 18px;font-size:clamp(1.2rem,3.5vw,1.65rem)}
.ms4045-problem-paper p,.ms4045-problem-paper li{font-size:clamp(1.04rem,2.7vw,1.24rem);line-height:1.72}
.ms4045-problem-paper mjx-container[display="true"]{font-size:clamp(1.08rem,2.9vw,1.35rem)!important;margin:1.35em 0!important;overflow-x:auto;overflow-y:hidden;padding:3px 0}
.ms4045-problem-paper mjx-container:not([display="true"]){font-size:1.04em!important}
.ms4045-math-click{cursor:pointer}
.ms4045-solution-stage{
  margin:0 0 26px;border:1px solid #d7e1e8;border-radius:18px;background:#fbfcfd;overflow:hidden
}
.ms4045-solution-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid #e4eaef;background:#f5f8fa
}
.ms4045-solution-head strong{font-size:1.05rem;color:#173f67}
.ms4045-solution-head span{font-size:.84rem;color:#687987}
.ms4045-solution-body{padding:20px clamp(16px,3.5vw,30px) 24px}
.ms4045-solution-body>.solution-step{display:none;margin:0 0 20px}
.ms4045-solution-body>.solution-step.is-visible{display:block}
.ms4045-solution-body p,.ms4045-solution-body li{font-size:1rem;line-height:1.68}
.ms4045-solution-body mjx-container[display="true"]{font-size:clamp(1.06rem,2.7vw,1.28rem)!important;margin:1.25em 0!important;overflow-x:auto;overflow-y:hidden;padding:3px 0}
.ms4045-solution-body mjx-container:not([display="true"]){font-size:1.03em!important}
.ms4045-tap-next{
  width:100%;padding:15px 18px;border:0;border-top:1px solid #e1e8ed;background:#fff;color:#184f73;
  font:inherit;font-weight:900;cursor:pointer;text-align:center
}
.ms4045-tap-next:disabled{color:#6f7c86;cursor:default}
.ms4045-solution-stage.is-complete .ms4045-tap-next{background:#f7fafb}
.ms4045-return-wrap{display:flex;justify-content:center;margin:28px 0 8px}
.ms4045-return{font-size:1.05rem;padding:13px 18px}
.ms4045-rule,.ms4045-method-note,.ms4045-warning,.ms4045-checkline{margin:16px 0;padding:14px 16px;border:1px solid #d9e3ea;border-radius:12px;background:#f7fafc}
.ms4045-diagram{margin:24px auto;max-width:680px}
.ms4045-diagram svg{display:block;width:100%;height:auto;background:#fff;border:1px solid #dce4ea;border-radius:12px}
.ms4045-diagram .axis{stroke:#3c5365;stroke-width:2}.ms4045-diagram .grid{stroke:#e5ebef;stroke-width:1}.ms4045-diagram .ghost{stroke:#9eb0bd;stroke-width:1.5;fill:none}.ms4045-diagram .shape{stroke:#315f7e;stroke-width:2.5;fill:none}.ms4045-diagram .accent{stroke:#a94b2f;stroke-width:2.5;fill:none}.ms4045-diagram .point{fill:#173f67}.ms4045-diagram text{font:16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#263744}
.ms4045-diagram figcaption{font-size:.9rem;line-height:1.5;color:#647480;margin-top:8px}
.ms4045-solution-table{width:100%;border-collapse:collapse;margin:18px 0}.ms4045-solution-table th,.ms4045-solution-table td{border:1px solid #d7e0e7;padding:10px;text-align:left}
@media(max-width:700px){
  .doc-paper{width:100%;padding:18px 12px 30px}
  .ms4045-q-topnav{font-size:.84rem}
  .ms4045-q-topnav a{padding:8px 10px}
  .ms4045-problem-paper{padding:22px 18px;border-radius:14px}
  .ms4045-solution-head{align-items:flex-start;flex-direction:column}
}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const stage=document.querySelector('.ms4045-solution-stage');
  if(!stage) return;
  const body=stage.querySelector('.ms4045-solution-body');
  const next=stage.querySelector('.ms4045-tap-next');
  const steps=[...body.children].filter(el=>!el.classList.contains('ms4045-answer-label'));
  steps.forEach(el=>el.classList.add('solution-step'));
  let shown=0;
  const revealNext=()=>{
    if(shown>=steps.length) return;
    steps[shown++].classList.add('is-visible');
    if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([steps[shown-1]]).catch(()=>{});
    if(shown>=steps.length){
      stage.classList.add('is-complete');
      next.textContent='Full solution shown';
      next.disabled=true;
    } else {
      next.textContent='Tap for next step';
    }
  };
  const revealAll=()=>{
    steps.forEach(el=>el.classList.add('is-visible'));
    shown=steps.length;
    stage.classList.add('is-complete');
    next.textContent='Full solution shown';
    next.disabled=true;
    if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([body]).catch(()=>{});
  };
  next.addEventListener('click',revealNext);
  body.addEventListener('click',e=>{
    if(e.target.closest('a,button')) return;
    revealNext();
  });
  document.querySelectorAll('.ms4045-problem-paper mjx-container, .ms4045-problem-paper .ms4045-math-click').forEach(el=>{
    el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();revealAll();});
  });
});
</script>
