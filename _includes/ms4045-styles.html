<style>
.ms4045-intro{margin:18px 0 22px;padding:18px 20px;border:1px solid #d9e2ea;border-radius:16px;background:linear-gradient(180deg,#fbfdff,#f6f9fc)}
.ms4045-intro strong{color:#173f67}
.ms4045-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0 26px}
.ms4045-card{display:block;padding:16px 18px;border:1px solid #dce3e9;border-radius:14px;background:#fff;text-decoration:none!important;box-shadow:0 6px 18px rgba(27,48,72,.06);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.ms4045-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(27,48,72,.11);border-color:#a8bdd0}
.ms4045-card small{display:block;margin-bottom:5px;color:#647586;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ms4045-card strong{display:block;color:#183a5b;font-size:1.05rem}
.ms4045-card span{display:block;margin-top:5px;color:#5b6874;line-height:1.45}
.ms4045-sheet-nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}
.ms4045-sheet-nav a{padding:8px 11px;border:1px solid #d7e0e8;border-radius:999px;background:#fff;text-decoration:none!important;font-weight:750}
.ms4045-source-note{margin:16px 0 22px;padding:13px 15px;border-left:4px solid #8ba9c4;background:#f6f9fc;border-radius:0 10px 10px 0;color:#4b5b69}
.ms4045-problem{margin:22px 0;padding:18px 20px;border:1px solid #e0e6eb;border-radius:15px;background:#fff;box-shadow:0 3px 12px rgba(30,48,66,.04)}
.ms4045-problem>h3{margin-top:0;color:#183a5b}
.ms4045-part{margin:10px 0}
.ms4045-equation{margin:12px 0;padding:13px 14px;border-radius:11px;background:#f7f9fb;overflow-x:auto}
.ms4045-solution{margin:14px 0;border:1px solid #d8e2ea;border-radius:13px;background:#fbfcfd;overflow:hidden}
.ms4045-solution>summary{cursor:pointer;padding:13px 16px;font-weight:850;color:#194d7a;list-style:none}
.ms4045-solution>summary::-webkit-details-marker{display:none}
.ms4045-solution>summary::before{content:"＋";display:inline-block;width:1.5em;color:#6a7f91;font-weight:700}
.ms4045-solution[open]>summary::before{content:"−"}
.ms4045-solution[open]>summary{border-bottom:1px solid #e1e7ec;background:#f4f8fb}
.ms4045-solution>.ms4045-answer{padding:2px 17px 16px}
.ms4045-answer p:last-child{margin-bottom:0}
.ms4045-diagram{margin:18px auto;padding:14px;border:1px solid #dce4ea;border-radius:14px;background:#fff;max-width:720px}
.ms4045-diagram figcaption{margin-top:9px;color:#5e6c78;font-size:.9rem;text-align:center}
.ms4045-diagram svg{display:block;width:100%;height:auto}
.ms4045-diagram .axis{stroke:#4c5964;stroke-width:1.4}
.ms4045-diagram .grid{stroke:#e6ebef;stroke-width:1}
.ms4045-diagram .shape{stroke:#1e5b8f;stroke-width:2.6;fill:none}
.ms4045-diagram .accent{stroke:#9a4e32;stroke-width:2.6;fill:none}
.ms4045-diagram .point{fill:#173f67}
.ms4045-diagram .ghost{stroke:#98a7b3;stroke-width:1.3;stroke-dasharray:5 5;fill:none}
.ms4045-diagram text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px;fill:#394854}
.ms4045-result{padding:10px 13px;border-left:4px solid #2a6b9e;background:#f4f8fb;border-radius:0 10px 10px 0}
.ms4045-warning{padding:10px 13px;border-left:4px solid #a66a2c;background:#fff9f1;border-radius:0 10px 10px 0}
.ms4045-two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ms4045-list-tight li{margin:6px 0}
@media (max-width:760px){.ms4045-grid,.ms4045-two-col{grid-template-columns:1fr}.ms4045-problem{padding:15px}.ms4045-card{padding:14px}}
</style>

<style>
.ms4045-solution-hero{margin:18px 0 24px;padding:20px;border:1px solid #d4dee7;border-radius:18px;background:linear-gradient(135deg,#f8fbfd 0%,#fff 70%)}
.ms4045-solution-hero h2{margin:0 0 6px;color:#173f67}
.ms4045-solution-hero p{margin:0;color:#536474}
.ms4045-method-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 4px}
.ms4045-method-step{padding:12px;border:1px solid #dde5eb;border-radius:12px;background:#fff}
.ms4045-method-step b{display:block;margin-bottom:4px;color:#183a5b;font-size:.95rem}
.ms4045-method-step span{color:#63717d;font-size:.88rem;line-height:1.35}
.ms4045-jump{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 0}
.ms4045-jump a,.ms4045-reveal-controls button{min-width:42px;padding:7px 10px;border:1px solid #d5dfe7;border-radius:999px;background:#fff;color:#194d7a;text-decoration:none!important;font-weight:800}
.ms4045-reveal-controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.ms4045-reveal-controls button{cursor:pointer;font:inherit}
.ms4045-answer-label{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 10px}
.ms4045-answer-label span{padding:4px 8px;border-radius:999px;background:#eef4f8;color:#496274;font-size:.76rem;font-weight:900;letter-spacing:.05em}
.ms4045-rule,.ms4045-checkline,.ms4045-method-note{margin:12px 0;padding:12px 14px;border-radius:11px}
.ms4045-rule{border-left:4px solid #245f91;background:#f3f8fc}
.ms4045-checkline{border-left:4px solid #3f7f62;background:#f4faf6}
.ms4045-method-note{border-left:4px solid #8a6a31;background:#fffaf0}
.ms4045-rule strong,.ms4045-checkline strong,.ms4045-method-note strong{display:inline-block;margin-right:.3rem}
.ms4045-solution-table{width:100%;border-collapse:collapse;margin:14px 0 18px;font-size:.95rem}
.ms4045-solution-table th,.ms4045-solution-table td{padding:9px 10px;border-bottom:1px solid #e3e8ec;text-align:left;vertical-align:top}
.ms4045-solution-table th{color:#183a5b;background:#f6f9fb;font-weight:850}
.ms4045-solution-table tr:last-child td{border-bottom:0}
.ms4045-final{margin:14px 0;padding:13px 15px;border:2px solid #d1dde7;border-radius:12px;background:#fff}
.ms4045-final strong{color:#173f67}
@media (max-width:760px){.ms4045-method-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ms4045-solution-table{font-size:.88rem}.ms4045-solution-table th,.ms4045-solution-table td{padding:8px 6px}}
@media (max-width:440px){.ms4045-method-grid{grid-template-columns:1fr}}
</style>
